# Builds the Windows, Mac and Linux installers on GitHub's computers and puts them on a Release page.
# Start it by pushing a version tag:   git tag v1.0.0   then   git push origin v1.0.0
name: Build NeonRealm desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Create the release with all installers
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "NeonRealm $GITHUB_REF_NAME" --notes "Download the file for your computer: Windows = NeonRealm-Setup-*.exe · Mac = NeonRealm-*-mac.dmg · Linux = .AppImage or .deb"
        env:
          GH_TOKEN: ${{ github.token }}
