<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Share your screen</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0, #12306a, #0a0f24 60%); color: #e8f6ff; font: 15px system-ui, sans-serif; user-select: none }
    header { padding: 18px 22px 8px }
    h1 { margin: 0; font-size: 22px; color: #00e5ff; text-shadow: 0 0 14px #00e5ff88 }
    p { margin: 6px 0 0; color: #9fe }
    .tabs { display: flex; gap: 8px; padding: 6px 22px 10px }
    button { font: inherit; border: 0; border-radius: 12px; padding: 9px 16px; cursor: pointer; font-weight: 700; background: #101a3a; color: #e8f6ff }
    .tabs button.on { background: #00e5ff; color: #001 }
    #grid { flex: 1; overflow: auto; padding: 4px 22px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; align-content: start }
    .src { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #0d1430; border: 2px solid #ffffff14; text-align: left; font-weight: 400 }
    .src:hover { border-color: #00e5ff88 }
    .src.on { border-color: #00e5ff; box-shadow: 0 0 18px #00e5ff66 }
    .th { aspect-ratio: 16/9; border-radius: 8px; background: #000; display: grid; place-items: center; overflow: hidden; font-size: 36px }
    .th img { width: 100%; height: 100%; object-fit: contain }
    .nm { display: flex; gap: 8px; align-items: center; font-size: 13px; min-width: 0 }
    .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .ic { width: 18px; height: 18px }
    .none { color: #9fe; grid-column: 1/-1 }
    #mac { padding: 0 22px 6px; font-size: 13px; color: #ffe600 }
    footer { display: flex; gap: 10px; align-items: center; padding: 12px 22px 18px; border-top: 1px solid #00e5ff33 }
    footer .sp { flex: 1 }
    #cancel { background: #ff6d00; color: #fff }
    #share { background: #39ff88; color: #001 }
    #share:disabled { opacity: .4; cursor: default }
    label { display: flex; gap: 8px; align-items: center; cursor: pointer }
    [hidden] { display: none !important }
  </style>
</head>
<body>
  <header><h1>🖥 Share your screen</h1><p>Pick what everyone in the call will see. Double-click to share straight away.</p></header>
  <div class="tabs"><button type="button" data-t="screen" class="on">Entire screen</button><button type="button" data-t="window">A window</button></div>
  <div id="grid"></div>
  <p id="mac" hidden>Mac: if the pictures are blank, allow NeonRealm in System Settings → Privacy &amp; Security → Screen &amp; System Audio Recording, then quit NeonRealm and open it again.</p>
  <footer>
    <label id="aud" hidden><input type="checkbox" id="snd" /> Share computer sound too</label>
    <span class="sp"></span>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="share" disabled>Share</button>
  </footer>
  <script>
    let all = [], tab = 'screen', sel = null;
    const $ = id => document.getElementById(id), grid = $('grid'), share = $('share');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safe = u => /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(u || '') ? u : '';
    function draw() {
      const list = all.filter(s => s.screen === (tab === 'screen'));
      grid.innerHTML = list.length ? '' : '<p class="none">Nothing to show here.</p>';
      list.forEach(s => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'src' + (sel === s.id ? ' on' : ''); b.title = s.name;
        b.innerHTML = `<div class="th">${safe(s.thumb) ? `<img src="${safe(s.thumb)}" alt="">` : '🖥'}</div><div class="nm">${safe(s.icon) ? `<img class="ic" src="${safe(s.icon)}" alt="">` : ''}<span>${esc(s.name)}</span></div>`;
        b.onclick = () => { sel = s.id; share.disabled = false; draw(); };
        b.ondblclick = () => { sel = s.id; go(); };
        grid.append(b);
      });
    }
    const go = () => { if (sel) picker.choose(sel, $('snd').checked); };
    share.onclick = go;
    $('cancel').onclick = () => picker.cancel();
    document.addEventListener('keydown', e => { if (e.key === 'Escape') picker.cancel(); else if (e.key === 'Enter' && sel) go(); });
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
    picker.onSources(d => {
      all = d.list || [];
      $('aud').hidden = d.platform !== 'win32'; $('mac').hidden = d.platform !== 'darwin';
      const screens = all.filter(s => s.screen); if (screens.length === 1) sel = screens[0].id;
      if (!screens.length) { tab = 'window'; document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === 'window')); }
      share.disabled = !sel; draw();
    });
  </script>
</body>
</html>
